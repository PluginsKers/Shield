name: Shield
version: '${version}'
main: com.eyreland.shield.ShieldPlugin
api-version: '1.21'
folia-supported: true
description: '艾尔大陆：异步在线反作弊事件采集'
author: PluginsKers
website: https://www.i5res.com
depend: [ProtocolLib]

commands:
  shield:
    description: Shield 在线事件状态命令
    permission: shield.admin
    usage: |
      /shield status
      /shield reload

permissions:
  shield.admin:
    description: 允许查看和重载 Shield
    default: op
