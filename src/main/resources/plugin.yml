name: shield
version: '${version}'
main: com.eyreland.shield.ShieldPlugin
api-version: '1.21.7'
folia-supported: true
description: '艾尔大陆反作弊核心插件'
author: PluginsKers
website: https://shield.i5res.com
depend: [ProtocolLib]

commands:
  shield:
    description: 查看 shield 状态或重载行动配置
    permission: shield.admin
    usage: '/shield [reload]'

permissions:
  shield.admin:
    description: 允许查看 shield 状态与重载行动配置
    default: op
