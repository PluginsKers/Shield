name: Shield
version: '${version}'
main: com.eyreland.shield.ShieldPlugin
api-version: '1.21'
folia-supported: true
description: '艾尔大陆：可配置、可预处理的玩家数据包采集'
author: PluginsKers
website: https://www.i5res.com
depend: [ProtocolLib]

commands:
  shield:
    description: Shield 采集管理命令
    permission: shield.admin
    usage: |
      /shield status
      /shield label <玩家|UUID> <normal|abnormal|clear>
      /shield reload

permissions:
  shield.admin:
    description: 允许管理 Shield 采集与玩家标记
    default: op
