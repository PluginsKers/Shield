name: shield
version: '${version}'
main: com.eyreland.shield.ShieldPlugin
api-version: '1.21.7'
folia-supported: true
description: '艾尔大陆反作弊核心插件'
author: PluginsKers
website: https://shield.i5res.com
depend: [ProtocolLib]

commands:
  shield:
    description: 查看 shield 状态、管理整体与玩家处置开关或重载配置
    permission: shield.admin
    usage: '/shield [reload|enable|disable] 或 /shield interventions <enable|disable>'

permissions:
  shield.admin:
    description: 允许查看 shield 状态、管理开关与重载配置
    default: op
