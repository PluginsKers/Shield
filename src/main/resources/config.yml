# 接入密钥，修改后需重启。
server-key: ""

# 上报地址，修改后需重启。
endpoint: "https://api.i5res.com/shield/v1/events"

# 总开关，可用 /shield enable、/shield disable 切换。
enabled: true

# 行动，修改后执行 /shield reload；windows 是连续 8 秒检测窗口数。
interventions:
  enabled: true
  # 连续 windows 个复查窗口后警告。
  warning:
    enabled: true
    windows: 3
    message: "行为异常"
  # 连续 windows 个优先复查窗口后踢出。
  kick:
    enabled: false
    windows: 3
    message: "异常行为持续发生"
