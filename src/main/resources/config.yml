# Shield 在线事件采集配置

inference:
  enabled: true
  endpoint: "https://api.i5res.com/shield/v1/events"
  key-id: "gray-local-20260729"
  # 可直接填写 hmac-secret；非空时优先于环境变量。发布模板不得包含真实密钥。
  hmac-secret: ""
  hmac-secret-env: "SHIELD_INFERENCE_HMAC_SECRET"
  allow-insecure-http: false

  # 玩家 UUID + 固定 salt 的稳定灰度。0 表示停采，100 表示全量。
  rollout-percent: 10.0
  rollout-salt: "shield-gray-v1"

  # 捕获线程只做非阻塞 offer；I/O 单线程批量 gzip 后发送。
  batch-size: 500
  flush-interval-ms: 1000
  queue-capacity: 20000
  connect-timeout-ms: 3000
  request-timeout-ms: 10000
  retry-initial-ms: 1000
  retry-max-ms: 60000
  max-send-batches-per-cycle: 4

  # 原始事件只允许进入有界、带 TTL 的短期重试区。
  spool-directory: "inference-spool"
  spool-max-bytes: 268435456
  spool-max-batches: 4096
  spool-ttl-ms: 21600000
  quarantine-max-batches: 32
  max-compressed-batch-bytes: 1500000
  max-uncompressed-batch-bytes: 10485760

capture:
  enabled: true
  # Velocity 多后端部署时必须为每个后端填写稳定且唯一的名称。
  server-id: "default"
  proxy-mode: "velocity"
  # 无实质移动/动作超过该时长后停止发送；0 表示关闭挂机过滤。
  afk-timeout-ms: 180000

  # include 的每个非空维度都必须命中；exclude 任一维度命中即拒绝。空列表表示不限制。
  # protocols 是 ProtocolLib 在后端连接上观测到的协议号。
  filters:
    include:
      uuids: []
      names: []
      worlds: []
      game-modes: []
      protocols: []
    exclude:
      uuids: []
      names: []
      worlds: []
      game-modes: [SPECTATOR]
      protocols: []

  # 显式白名单：只有这里列出的包才会发送。新增到 Shield 的包不会随升级自动开启。
  # 值可写 true，也可写规则段：
  #   min-interval-ms: 同一玩家同一 rate-limit-group 的最小采样间隔
  #   include-actions 与 exclude-actions：解码后的动作白名单和黑名单
  #   raw-fields: 额外保存受限的原始标量/record 字段，用于低频包的版本诊断
  packets:
    POSITION:
      min-interval-ms: 50
      rate-limit-group: movement
    POSITION_LOOK:
      min-interval-ms: 50
      rate-limit-group: movement
    LOOK:
      min-interval-ms: 50
      rate-limit-group: movement
    GROUND:
      min-interval-ms: 50
      rate-limit-group: movement

    # 26.1+ 的攻击独立为 ATTACK；1.21.11 等版本仍从 USE_ENTITY 解出 ATTACK。
    # 同时声明可让当前运行时自动选择受支持的形态。
    ATTACK: true
    USE_ENTITY:
      raw-fields: true
    ARM_ANIMATION: true

    USE_ITEM: true
    USE_ITEM_ON: true
    BLOCK_DIG: true
    ENTITY_ACTION: true
    ABILITIES: true

    # 旧版为扁平 float/boolean，现代版本为 Input record。
    STEER_VEHICLE:
      raw-fields: true
    VEHICLE_MOVE:
      min-interval-ms: 50
    BOAT_MOVE: true

    HELD_ITEM_SLOT: true
    WINDOW_CLICK:
      raw-fields: true

  # 目录还支持按需加入：CLOSE_WINDOW、SET_CREATIVE_SLOT、ENCHANT_ITEM、PICK_ITEM、
  # PICK_ITEM_FROM_BLOCK、CLIENT_COMMAND、TELEPORT_ACCEPT、PLAYER_LOADED、CLIENT_TICK_END、
  # KEEP_ALIVE、PONG。聊天与自定义载荷不在目录中，避免无意采集隐私或任意插件数据。
